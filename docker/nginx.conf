server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 优先发送构建时预压缩的 .gz；没有 .gz 的文件再动态压缩
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # wasm/js 文件名不带哈希，用 no-cache + ETag：每次协商，未变化时返回 304
    location ~* \.(wasm|js|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
